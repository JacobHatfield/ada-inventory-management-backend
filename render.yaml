services:
  - type: web
    name: inventory-backend
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
      - key: DEBUG
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ALGORITHM
        value: HS256
      - key: BACKEND_CORS_ORIGINS
        value: "*" # Update this with your frontend URL later
      - key: SENDGRID_API_KEY
        sync: false # Set this in the Render dashboard
      - key: SMTP_FROM_EMAIL
        sync: false # Must be a verified sender in SendGrid

databases:
  - name: inventory-db
    plan: free # Change to starter if needed
    region: frankfurt # Or your preferred region
